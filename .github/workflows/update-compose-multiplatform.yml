name: Update Compose Multiplatform

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-compose-multiplatform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare update
    runs-on: ubuntu-latest
    outputs:
      compose: ${{ steps.select.outputs.compose }}
      material3: ${{ steps.select.outputs.material3 }}
      adaptive: ${{ steps.select.outputs.adaptive }}
      adaptive-status: ${{ steps.select.outputs.adaptive-status }}
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select versions
        id: select
        run: python3 .github/scripts/select_compose_versions.py

      - name: Check for catalog changes
        id: catalog
        run: |
          if git diff --quiet gradle/libs.versions.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup build
        if: steps.catalog.outputs.changed == 'true'
        uses: ./.github/actions/setup-build

      - name: Regenerate yarn.lock
        if: steps.catalog.outputs.changed == 'true'
        run: ./gradlew kotlinWasmUpgradeYarnLock

      - name: Create patch
        id: patch
        run: |
          git diff --binary > "$RUNNER_TEMP/update.patch"
          if [ -s "$RUNNER_TEMP/update.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch

  open-pull-request:
    name: Open pull request
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/update-compose-multiplatform
      COMPOSE: ${{ needs.prepare.outputs.compose }}
      MATERIAL3: ${{ needs.prepare.outputs.material3 }}
      ADAPTIVE: ${{ needs.prepare.outputs.adaptive }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download patch
        uses: actions/download-artifact@v8
        with:
          name: update-patch
          path: ${{ runner.temp }}

      - name: Push branch and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          title="build(deps): bump Compose Multiplatform to $COMPOSE"
          body="$(printf 'Compose Multiplatform: %s\nmaterial3: %s\nMaterial3 Adaptive: %s\n' \
            "$COMPOSE" "$MATERIAL3" "${ADAPTIVE:-unchanged}")"
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          git switch -C "$BRANCH"
          git apply "$RUNNER_TEMP/update.patch"
          git add --all
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit --message "$title"
          if [ -n "$pr" ] && git fetch --quiet origin "$BRANCH" \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "The open pull request already holds this update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            pr="$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body")"
            gh pr merge "$pr" --auto --squash
          fi

  close-pull-request:
    name: Close unneeded pull request
    needs: prepare
    if: needs.prepare.outputs.changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      BRANCH: chore/update-compose-multiplatform
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find open pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        if: steps.find.outputs.url != ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Close pull request
        if: steps.find.outputs.url != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.find.outputs.url }}
          COMPOSE: ${{ needs.prepare.outputs.compose }}
          MATERIAL3: ${{ needs.prepare.outputs.material3 }}
        run: |
          gh pr close "$PR" --delete-branch --comment \
            "main already uses Compose Multiplatform $COMPOSE and material3 $MATERIAL3, so this update is no longer needed."

  report-adaptive:
    name: Report Material3 Adaptive
    needs: [prepare, open-pull-request]
    if: always() && contains(fromJSON('["unparseable", "overdue"]'), needs.prepare.outputs.adaptive-status)
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        env:
          COMPOSE: ${{ needs.prepare.outputs.compose }}
          STATUS: ${{ needs.prepare.outputs.adaptive-status }}
        run: |
          if [ "$STATUS" = "overdue" ]; then
            echo "::error::Material3 Adaptive for Compose Multiplatform $COMPOSE is still missing from the changelog or Maven Central more than three days after the release."
          else
            echo "::error::Could not read the Material3 Adaptive version for Compose Multiplatform $COMPOSE from the Compose Multiplatform changelog."
          fi
          exit 1
