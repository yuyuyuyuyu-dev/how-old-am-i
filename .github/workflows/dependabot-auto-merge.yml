name: Dependabot auto-merge

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # A GitHub App rather than GITHUB_TOKEN: the merge is attributed to whoever
      # enabled auto-merge, and a push attributed to GITHUB_TOKEN triggers no
      # workflows, so it would skip the CI run on main that Deploy waits for.
      #
      # Pinned rather than @v3: actionlint's metadata for the @v3 tag predates
      # `client-id` superseding `app-id`, and its lookup is an exact match on the ref.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      # `update-type` is the highest semver bump in the pull request, so a group is
      # merged only when every dependency in it is minor or patch.
      - name: Enable auto-merge
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR_URL}"
